# api.addict.clinic → CRM API (functions.poehali.dev), прозрачная пересылка
# https://api.addict.clinic/?resource=leads  ==  https://functions.poehali.dev/<id>?resource=leads

server {
    listen 80;
    listen [::]:80;
    server_name api.addict.clinic;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.addict.clinic;

    ssl_certificate     /etc/letsencrypt/live/api.addict.clinic/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.addict.clinic/privkey.pem;
:q;
    client_max_body_size 1m;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    set $api "https://functions.poehali.dev/1145187d-844f-4f3f-8a1f-575d26202624";

    location / {
        proxy_pass $api$is_args$args;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host functions.poehali.dev;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Authorization $http_authorization;
        proxy_read_timeout 30s;
    }
}