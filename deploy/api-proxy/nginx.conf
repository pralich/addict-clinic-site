# api.addict.clinic → CRM API (functions.poehali.dev)
# Положить в /etc/nginx/sites-available/api.addict.clinic, включить симлинком в sites-enabled,
# выпустить сертификат: certbot --nginx -d api.addict.clinic

server {
    listen 80;
    listen [::]:80;
    server_name api.addict.clinic;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.addict.clinic;

    ssl_certificate     /etc/letsencrypt/live/api.addict.clinic/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.addict.clinic/privkey.pem;

    client_max_body_size 1m;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    set $fn_host "functions.poehali.dev";
    set $fn_path "/1145187d-844f-4f3f-8a1f-575d26202624";

    location = / {
        default_type application/json;
        return 200 '{"name":"addict.clinic CRM API","version":"v1","docs":"https://addict.clinic/admin?page=api"}';
    }

    # /v1/leads/ext/ABC-1  → ?resource=leads&external_id=ABC-1
    location ~ ^/v1/(leads|clients|deals)/ext/([^/]+)/?$ {
        set $res $1;
        set $ext $2;
        proxy_pass https://$fn_host$fn_path?resource=$res&external_id=$ext&$args;
        include /etc/nginx/snippets/addict-api-proxy.conf;
    }

    # /v1/leads/123  → ?resource=leads&id=123
    location ~ ^/v1/(leads|clients|deals)/([0-9]+)/?$ {
        set $res $1;
        set $id $2;
        proxy_pass https://$fn_host$fn_path?resource=$res&id=$id&$args;
        include /etc/nginx/snippets/addict-api-proxy.conf;
    }

    # /v1/leads, /v1/ping, /v1/dictionaries, /v1/site_lead
    location ~ ^/v1/(leads|clients|deals|ping|dictionaries|site_lead)/?$ {
        set $res $1;
        proxy_pass https://$fn_host$fn_path?resource=$res&$args;
        include /etc/nginx/snippets/addict-api-proxy.conf;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"Неизвестный адрес. Доступно: /v1/leads, /v1/clients, /v1/deals, /v1/ping, /v1/dictionaries"}';
    }
}
